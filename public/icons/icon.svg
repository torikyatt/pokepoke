<!-- アプリのアイコン（scripts/icons.ts で PNG にする）。カード2枚と虫めがね＝「カードを引ける図鑑」。
     ポケモンらしさは、カードの絵の雷マークと、タイプごとのエネルギーの色の玉で出す（公式のデザインは使わない） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3cc7b6"/>
      <stop offset="1" stop-color="#1f8f82"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 後ろのカード -->
  <rect x="118" y="104" width="196" height="272" rx="26" fill="#ffffff" opacity="0.45" transform="rotate(-12 216 240)"/>
  <!-- 前のカード -->
  <g transform="rotate(6 268 250)">
    <rect x="170" y="100" width="196" height="272" rx="26" fill="#ffffff"/>
    <rect x="194" y="126" width="148" height="104" rx="14" fill="#fff4c2"/>
    <path d="M276 136 L240 186 L264 186 L250 222 L298 166 L272 166 L288 136 Z" fill="#f5c400" stroke="#e0a800" stroke-width="5" stroke-linejoin="round"/>
    <rect x="194" y="250" width="148" height="14" rx="7" fill="#c9d3df"/>
    <rect x="194" y="278" width="110" height="14" rx="7" fill="#c9d3df"/>
  </g>
  <!-- エネルギーの玉（炎・水・草） -->
  <g stroke="#ffffff" stroke-width="7">
    <circle cx="96" cy="96" r="30" fill="#ef5a43"/>
    <circle cx="96" cy="176" r="24" fill="#3d93e8"/>
    <circle cx="160" cy="62" r="22" fill="#5bbf4a"/>
  </g>
  <!-- 虫めがね -->
  <circle cx="306" cy="314" r="72" fill="#ffffff" fill-opacity="0.25" stroke="#3d4757" stroke-width="30"/>
  <path d="M358 366 L410 418" stroke="#3d4757" stroke-width="40" stroke-linecap="round"/>
</svg>
