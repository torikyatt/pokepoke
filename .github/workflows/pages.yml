# main に push されたら、テストしてビルドし、gh-pages ブランチに公開する（GitHub Pages）
# 新しいサイトに引っ越したら、リポジトリの Settings → Secrets and variables → Actions → Variables に
# NEW_SITE_URL（例: https://example.com）を入れる。以後は、古いURLに来た人を新しいサイトへ送るページだけを公開する
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !vars.NEW_SITE_URL }}
        run: npm run validate
      - if: ${{ !vars.NEW_SITE_URL }}
        run: npm test
      - if: ${{ !vars.NEW_SITE_URL }}
        run: npm run typecheck
      - if: ${{ !vars.NEW_SITE_URL }}
        run: npm run build
      - name: 新しいサイトへの転送ページを作る
        if: ${{ vars.NEW_SITE_URL }}
        run: npx tsx scripts/redirect-site.ts
        env:
          NEW_SITE_URL: ${{ vars.NEW_SITE_URL }}
      - name: gh-pages に公開
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ vars.NEW_SITE_URL && './dist-redirect' || './dist' }}
          force_orphan: true
          commit_message: "公開: ${{ github.sha }}"
