# 攻略記事で紹介されている、カードどうしの組み合わせ（相性のいいカードに「なぜ合うか」として出す）。
# 理由は記事の内容をもとに、短く自分の言葉でまとめたもの（reasonEn は英語表示用）。記事の文章はそのまま載せない。
#
# cards の書き方:
#   名前            … 同じ名前のカードが複数あれば、大会でいちばん使われているもの
#   名前@セット      … そのセットのもの（例: ルカリオ@a2）
#   カードID        … そのカード（例: a2-092）
# 1つの組み合わせに3枚以上書くと、その中の全部の組を結ぶ。

- deck: メガルカリオexデッキ
  deckEn: Mega Lucario ex
  source: https://game8.jp/pokemon-tcg-pocket/781960
  combos:
    - cards: [メガルカリオex, ルカリオ@a2]
      reason: ルカリオの特性で闘ワザのダメージが上がり、メガルカリオexのワンパン圏が広がる
      reasonEn: "Lucario's Ability raises Fighting damage, widening what Mega Lucario ex can one-hit-KO"
    - cards: [メガルカリオex, いにしえの闘技場]
      reason: 闘技場で打点を上乗せして、メガシンカexもワンパンを狙える
      reasonEn: Arena of Antiquity adds damage so even Mega Evolution ex can be taken down in one hit
    - cards: [メガルカリオex, コルニ]
      reason: コルニで打点を上乗せして、高HPのexを一撃で倒す
      reasonEn: "Korrina's boost lets Mega Lucario ex knock out high-HP Pokémon ex in one attack"
    - cards: [サワムラー@a1, アカギ]
      reason: ベンチに狙撃でダメージを入れ、アカギで引きずり出してとどめを刺す
      reasonEn: "Hitmonlee snipes the Bench, then Cyrus drags the damaged Pokémon out to finish it"
    - cards: [サワムラー@a1, メガルカリオex]
      reason: サワムラーでベンチを削り、メガルカリオexで取りきる役割分担
      reasonEn: Hitmonlee softens the Bench while Mega Lucario ex takes the Knock Outs

