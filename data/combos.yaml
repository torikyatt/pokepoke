# 攻略記事で紹介されている、カードどうしの組み合わせ（相性のいいカードに「なぜ合うか」として出す）。
# 理由は記事の内容をもとに、短く自分の言葉でまとめたもの。記事の文章はそのまま載せない。
#
# cards の書き方:
#   名前            … 同じ名前のカードが複数あれば、大会でいちばん使われているもの
#   名前@セット      … そのセットのもの（例: ルカリオ@a2）
#   カードID        … そのカード（例: a2-092）
# 1つの組み合わせに3枚以上書くと、その中の全部の組を結ぶ。

- deck: メガルカリオexデッキ
  source: https://game8.jp/pokemon-tcg-pocket/781960
  combos:
    - cards: [メガルカリオex, ルカリオ@a2]
      reason: ルカリオの特性で闘ワザのダメージが上がり、メガルカリオexのワンパン圏が広がる
    - cards: [メガルカリオex, いにしえの闘技場]
      reason: 闘技場で打点を上乗せして、メガシンカexもワンパンを狙える
    - cards: [メガルカリオex, コルニ]
      reason: コルニで打点を上乗せして、高HPのexを一撃で倒す
    - cards: [サワムラー@a1, アカギ]
      reason: ベンチに狙撃でダメージを入れ、アカギで引きずり出してとどめを刺す
    - cards: [サワムラー@a1, メガルカリオex]
      reason: サワムラーでベンチを削り、メガルカリオexで取りきる役割分担

- deck: スイクンex＆セグレイブデッキ
  source: https://game8.jp/pokemon-tcg-pocket/712693
  combos:
    - cards: [セグレイブ, パオジアンex]
      reason: セグレイブのエネ加速で、パオジアンexの大技を毎ターン撃てる
    - cards: [スイクンex, セグレイブ]
      reason: スイクンexの特性で毎ターン1枚引けるので、セグレイブまでの進化がそろいやすい
    - cards: [セビエ, セグレイブ, ふしぎなアメ]
      reason: 2進化のセグレイブを早く立てる
    - cards: [スイクンex, マーズ]
      reason: 押し込んだあとマーズで相手の手札を減らし、反撃の手を絞る

- deck: エーフィ＆ダークライデッキ
  source: https://game8.jp/pokemon-tcg-pocket/700110
  combos:
    - cards: [イーブイ@pb, エーフィ@b3a]
      reason: イーブイの特性で、場に出したターンにすぐエーフィへ進化できる
    - cards: [ダークライ@b2b, エーフィ@b3a]
      reason: エーフィでねむりにし、ダークライの特性で番の終わりごとにダメージを足す
    - cards: [ダークライ@b2b, ププリン]
      reason: ププリンでねむりにして、ダークライの特性ダメージを重ねる
    - cards: [メガチルタリスex, トレーニングエリア]
      reason: トレーニングエリアで打点が上がり、終盤に高HPのexを倒しきれる

- deck: フーパex＆ダークライexデッキ
  source: https://game8.jp/pokemon-tcg-pocket/802550
  combos:
    - cards: [フーパex, ダークライex, いんちきバリ]
      reason: 軽いワザにダメージを上乗せし、序盤からバトル場とベンチを削り続ける
    - cards: [フーパex, アカギ]
      reason: ベンチに入れたダメージを、アカギで呼び出して取りきる
    - cards: [フーパex, サザンドラ]
      reason: フーパexで削り、サザンドラの高打点で倒しきる

- deck: ビークインex＆ツボツボexデッキ
  source: https://game8.jp/pokemon-tcg-pocket/802573
  combos:
    - cards: [ビークインex, ツボツボex]
      reason: ツボツボexを壁にして時間を稼ぎ、弱ったらビークインexのワザでトラッシュして打点にする
    - cards: [ビークインex, あまくかおる森]
      reason: あまくかおる森で草のたねを補充し、ビークインexのワザを毎ターン撃てる
    - cards: [ビークインex, オーガポンex（みどりのめん）]
      reason: オーガポンexがいると、エネの付いた味方がねむりなどの特殊状態にならない

- deck: バタフリー＆メガジュカインexデッキ
