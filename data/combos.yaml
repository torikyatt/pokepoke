  combos:
    - cards: [キャタピー@b3b, トランセル@b3b, バタフリー@b3b]
      reason: キャタピーの特性で山札からトランセルに進化し、2ターン目からバタフリーで攻撃できる
    - cards: [バタフリー@b3b, あまくかおる森, そうじゅくエキス]
      reason: 山札を減らして、進化に必要なカードを引きやすくする
    - cards: [バタフリー@b3b, メガジュカインex]
      reason: バタフリーで序盤を戦い、打点不足をメガジュカインexの大ダメージで補う

- deck: メガレックウザex＆ウガツホムラデッキ
