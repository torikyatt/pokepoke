      reason: 後攻2ターン目から高打点を連発して、相手のエースより先に殴れる
    - cards: [ウガツホムラ, オーリム博士]
      reason: オーリム博士で古代ポケモンのウガツホムラにエネを付けて起動を早める

- deck: エレザード＆メガライボルトexデッキ
