      reason: エレザードで先にポイントを取り、ポイントで強くなるメガライボルトexで仕上げる
    - cards: [シトロン, シトロンのリュック]
      reason: シトロンで手札を整えつつ、リュックの出番を作る

- deck: ミライドンex＆ジバコイルデッキ
  source: https://game8.jp/pokemon-tcg-pocket/785697
  combos:
    - cards: [レアコイル@a1, ミライドンex]
      reason: レアコイルが特性でためたエネを、ミライドンexが場に出たときに集めて打点にする
    - cards: [オドリドリ（ぱちぱち）, レアコイル@a1]
      reason: オドリドリの特性でexの攻撃をしのぎ、その間にベンチのレアコイルにエネをためる
    - cards: [フトゥー博士, ミライドンex]
      reason: 傷ついたミライドンexを山札に戻してポイントを渡さず、もう一度出し直す
    - cards: [レアコイル@a1, ジバコイル]
      reason: エネをためたレアコイルをそのまま進化させ、中盤の打点役にする
