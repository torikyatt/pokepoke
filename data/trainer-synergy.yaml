# トレーナーズ（サポート・グッズ・どうぐ・スタジアム）が「どのカードに効くか」。効果文を全部読んで書いたもの。
# ポケモンを名指ししているもの（カツラ・シロナ・マチスなど）は効果文から自動で結ぶので、ここには書かない。
# ここには「草ポケモン」「2進化ポケモン」「古代のポケモン」「ワザ『サイコキネシス』を持つポケモン」のように、
# 条件で効く相手が決まるものを書く。相性のいいカードに、label を理由として出す。
#
# to に書ける条件（全部満たすカードに効く。kinds を書かなければポケモンだけ）
#   types: [grass]            タイプ
#   stages: [stage2]          進化段階（basic / stage1 / stage2）
#   groups: [ancient]         グループ（ultra_beast / ancient / future / team_rocket / baby）
#   rules: [mega_ex]          ルール（normal / ex / mega_ex）
#   notRules: [ex, mega_ex]   このルールは除く
#   retreatMin: 3             にげるエネがこれ以上
#   attacks: [Psychic]        このワザ（英語名）を持つ
#   cost: {type: water, min: 1}  ワザにこのタイプのエネをこれ以上使う
#   multiType: true           ワザに2タイプ以上のエネを使う
#   tags: [damage.bench]      このタグ（子タグも含む）の効果を持つ
#   kinds: [tool]             トレーナーズに効くとき（item / tool / stadium / supporter）
# weight を書かなければ 1.2（名指しは3、攻略記事の組み合わせは4）

# ---- タイプ ----
a1-219: # エリカ
  - to: { types: [grass] }
    label: 草ポケモンを回復
a1a-065: # 幻の石板
  - to: { types: [psychic] }
    label: 山札の上の超ポケモンを手札に
a2a-072: # カイ
  - to: { cost: { type: water, min: 1 } }
    label: 水エネの付いたポケモンをまとめて回復
a2a-075: # セキ
  - to: { types: [metal] }
    label: 鋼ポケモンの受けるダメージを減らす
a3-143: # おさかなネット
