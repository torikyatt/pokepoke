# タグ階層の正本（人が編集する）。Claude Docs「ポケポケ検索 タグ階層 叩き台」に沿う。
#
# 各タグ:
#   id       ドット区切り。親タグで検索すると子タグも一致する（最大3階層）
#   ja       表示名
#   match    英語原文に当てる正規表現（どれか1つに一致すれば付与）。文単位で当てる
#   exclude  一致しても、この正規表現に当たる文なら付与しない
#   on       付与対象を絞る（attack / ability / trainer / tool）。省略時は全部
#   supplies / requires  シナジー判定用。同じ supply.* を供給するカードと要求するカードを結ぶ
#
# 正規表現の前処理（scripts/tag.ts）:
#   "[ R ]" → "[R]"、"Pokemon" → "Pokémon"、"−" → "-"、’ → '、文は ". " で分割
#   アポストロフィは YAML で書きにくいので "opponent.s" のように . で受ける

- id: energy
  ja: エネルギー
  children:
    - id: energy.accel
      ja: エネ加速
      supplies: [supply.energy.many]
      match:
        - 'provides 2 \[[A-Z]\] Energy'
      children:
        - id: energy.accel.zone
          ja: エネゾーンから加速
          match:
            - '(take|Take|produce|Take an amount of) [^.]*Energy from your Energy Zone'
        - id: energy.accel.trash
          ja: トラッシュから加速
          requires: [supply.trash.energy]
          match:
            - '[Aa]ttach [^.]*Energy from your discard pile'
            - 'Attach \d+ random Energy from your discard pile'
        - id: energy.accel.other
          ja: 他のポケモンに付ける
          match:
            - '(Energy Zone|discard pile)[^.]*attach (it|them|1 Energy each) to (?!this Pok)'
            - 'Energy Zone and attach it to each of'
            - 'Choose 2 of your Benched Pokémon\. For each of those Pokémon, take'
            - 'attach 1 Energy each to 2 of your Benched'
            - 'Energy from your discard pile to (your|that)'
    - id: energy.move
      ja: エネ移動
      match:
        - '[Mm]ove (a|an|all|2|any amount of|2 random)[^.]*Energy'
        - 'move a random Energy from your opponent'
    - id: energy.self_discard
      ja: 自分のエネをトラッシュ
      supplies: [supply.trash.energy, supply.trash.fill]
      match:
        - '[Dd]iscard [^.]*Energy (from|attached to) this Pokémon'
        - 'Energy attached to all of your Pokémon'
        - 'discard 2 \[P\] Energy from that Pokémon'
        - 'discard all Energy from that Pokémon'
        - 'discard a random Energy from that Pokémon'
    - id: energy.discard_opp
      ja: 相手のエネを破壊
      match:
        - '[Dd]iscard [^.]*Energy from (your opponent|both Active)'
        - 'Energy attached to all (Pokémon|of your opponent)'
        - '[Dd]iscard [^.]*Energy from your opponent.s Active'
    - id: energy.cost_down
      ja: コスト軽減
      children:
        - id: energy.cost_down.attack
          ja: ワザのエネが減る
          match:
            - 'cost \d+ less'
            - 'can be used for 1 \['
        - id: energy.cost_down.retreat
          ja: にげるエネが減る
          supplies: [supply.retreat.help]
          match:
            - 'Retreat Cost (of [^.]* )?is \d+ less'
            - 'Retreat Cost of your Active Pokémon is \d+ less'
            - 'has no Retreat Cost'
            - 'Retreat Cost of [^.]* is \d+ less'
    - id: energy.manipulate
      ja: エネルギーゾーン操作
      match:
        - 'Change the type of'
        - 'discard the Energy that has been generated'

- id: draw
  ja: ドロー・サーチ
  children:
    - id: draw.draw
      ja: ドロー
      match:
        - '\b[Dd]raw (a card|\d+ cards?|cards until)'
        - '[Dd]raws? cards until'
        - 'then draws that many cards'
        - '[Dd]raw a card for each'
      exclude:
        - '^Your opponent shuffles their hand'
        - 'opponent shuffle their hand'
    - id: draw.search_pokemon
      ja: 山札からポケモンを持ってくる
      match:
        - '[Pp]ut (a|1|2|3) random (?!(Item|Supporter|Pokémon Tool|Stadium))[^.]* from (your|their) deck (into|onto) (your|their) (hand|Bench)'
        - 'puts? a random (Basic )?(\[[A-Z]\] )?Pokémon from (your|their) deck into'
        - 'put a random Pokémon that has [^.]* from your deck into your hand'
        - 'Put a random card that evolves from [^.]* from your deck into your hand'
        - 'Put all (Stage 1 )?Pokémon you find there'
        - 'put a random \[[A-Z]\] Pokémon from your deck into your hand'
        - 'random Pokémon in your deck'
        - 'Put 2 random cards from among Magneton'
    - id: draw.search_trainer
      ja: 山札からトレーナーズを持ってくる
      match:
        - '[Pp]ut a random (Item|Supporter|Pokémon Tool|Stadium) card from your deck'
        - 'Put all (Pokémon Tool|Item) cards you find there'
        - 'put all Item cards you find there'
        - 'random Pokémon Tool card in their deck'
        - 'Clemont.s Backpack from your deck'
    - id: draw.deck_look
      ja: 山札を見る・並べ替え
      match:
        - '[Ll]ook at (the top|that many cards from the top)'
        - 'put them back in any order'
        - 'Reveal the top \d+ cards of your deck'
        - 'Look at the top card of that player'
    - id: draw.recover
      ja: トラッシュから回収
      match:
        - 'from (your|your opponent.s) discard pile into your hand'
        - 'from your discard pile and put into your hand'
        - 'chosen at random from your discard pile and put into your hand'
        - 'put it into your hand instead of the discard pile'
        - 'into your hand instead of the discard pile'

- id: damage
  ja: ダメージ
  children:
    - id: damage.bench
      ja: ベンチ狙撃
      match:
        - '(damage to|do \d+ damage to) (1|2|each) of your opponent.s (Benched )?Pokémon'
        - '1 of your opponent.s (Benched )?Pokémon is chosen at random'
        - 'all Benched Pokémon'
        - '1 other Pokémon \(either yours or your opponent.s\)'
        - 'Choose a spot from among your opponent.s Active Spot and Bench'
        - 'damage to (2|each) of your opponent.s Benched'
        - 'damage for each heads to each of your opponent.s Benched'
        - 'damage to 1 of your opponent.s Pokémon'
    - id: damage.spread
      ja: 全体攻撃
      match:
        - 'damage (for each heads )?to (each of your opponent.s|all Benched)'
        - 'do \d+ damage to each of your opponent.s Pokémon'
    - id: damage.self
      ja: 自傷
      supplies: [supply.damage.self]
      match:
        - 'damage to itself'
        - 'do \d+ damage to this Pokémon'
        - 'damage to (1|each) of your (Benched )?Pokémon'
        - 'damage to all Benched Pokémon \(both yours'
        - 'move all of its damage to this Pokémon'
        - 'move \d+ damage that your Active Pokémon has on it to this Pokémon'
    - id: damage.ko
      ja: 一撃でたおす・HPを削る
      match:
        - 'Knock Out (your opponent.s Active|the Pokémon in the spot)'
        - 'opponent.s Active Pokémon is Knocked Out'
        - 'the Attacking Pokémon is Knocked Out'
        - '[Dd]iscard your opponent.s Active Pokémon'
        - 'remaining HP is now 10'
        - 'Halve your opponent.s Active'
    - id: damage.direct
      ja: ワザ以外でダメージ
      on: [ability, trainer, tool]
      match:
        - 'do \d+ damage to (your opponent|1 of your opponent|each of your opponent|that Pokémon)'
        - 'move \d+ of its damage to your opponent'
    - id: damage.pierce
      ja: 弱点・効果を無視
      match:
        - 'isn.t affected by (Weakness|any effects)'
        - 'apply Weakness as'
    - id: damage.boost
      ja: 火力アップ
      match:
        - '(do|does) \+\d+ damage'
        - 'takes \+\d+ damage'
        - 'takes \+\d+ damage from being Poisoned'
        - 'is chosen 1 more time'
    - id: damage.delayed
      ja: 時間差でダメージ・きぜつ
      match:
        - 'At the end of your opponent.s next turn, (do|Knock)'
    - id: damage.multi_hit
      ja: 連続攻撃
      match:
        - 'used twice in a row'
        - 'chosen at random \d+ times'

- id: heal
  ja: 回復
  children:
    - id: heal.hp
      ja: HP回復
      match:
        - '[Hh]eals? (\d+|all) damage'
        - '[Hh]eal from this Pokémon'
        - 'move all of its damage to this Pokémon'
        - 'move \d+ damage that your Active Pokémon has on it'
      exclude:
        - 'heal 30 damage from your opponent'
      children:
        - id: heal.hp.bench
          ja: ベンチ・味方も回復
          match:
            - '[Hh]eals? \d+ damage from (each of|1 of) (your|their)'
            - '[Hh]eal \d+ damage from each of your Benched'
            - '[Hh]eal \d+ damage from (1 of your Benched|your Active)'
            - 'heal (\d+|all) damage from 1 of your'
            - 'choose 1 of your Pokémon that has damage on it, and move all'
            - 'move \d+ damage that your Active Pokémon'
    - id: heal.status
      ja: 状態異常を回復・防ぐ
      match:
        - 'recovers? from'
        - 'remove a random Special Condition'
        - 'can.t be affected by any Special Conditions'
        - 'can.t be Asleep'

- id: defense
  ja: 防御
  children:
    - id: defense.reduce
      ja: ダメージ軽減
      match:
        - 'takes? -\d+ damage'
        - '(Defending Pokémon|opponent.s Active Pokémon) do -\d+ damage'
    - id: defense.no_damage
      ja: ダメージを受けない
      match:
        - '[Pp]revent all damage'
        - 'prevent that damage'
        - 'When this Pokémon is first damaged by an attack after coming into play, prevent'
    - id: defense.no_effect
      ja: ワザの効果を受けない
      match:
        - 'effects of—attacks'
        - 'Prevent all effects of attacks'
    - id: defense.hp_up
      ja: HPアップ
      match:
        - 'gets \+\d+ HP'
    - id: defense.counter
      ja: 反撃
      match:
        - 'damage to the Attacking Pokémon'
        - 'the Attacking Pokémon is (now|Knocked)'
        - 'damage to the new Active Pokémon'
    - id: defense.survive
      ja: きぜつしない
      match:
        - 'is not Knocked Out'
        - 'can.t get any points for it'
    - id: defense.no_weakness
      ja: 弱点なし
      match:
        - 'has no Weakness'

- id: status
  ja: 状態異常
  # 状態異常にする側。scripts/tag.ts が「相手を状態異常にする文」だけに付ける（条件文・自分が受ける文は除く）
  supplies: [supply.status]
  children:
    - { id: status.poison, ja: どく, match: ['Poisoned'] }
    - { id: status.burn, ja: やけど, match: ['Burned'] }
    - { id: status.paralysis, ja: マヒ, match: ['Paralyzed'] }
    - { id: status.sleep, ja: ねむり, match: ['Asleep'] }
    - { id: status.confusion, ja: こんらん, match: ['Confused'] }
    - id: status.no_attack
      ja: ワザ封じ
      match:
        - 'Defending Pokémon can.t attack'
        - 'it can.t attack during your opponent'
        - 'can.t use the chosen attack'
        - 'that attack doesn.t happen'
    - id: status.no_retreat
      ja: にげる封じ
      match:
        - 'can.t retreat'
        - 'Retreat Cost is \d+ (\[C\] )?more'
      exclude:
        - 'This card can.t retreat'

- id: disrupt
  ja: 妨害
  children:
    - id: disrupt.hand
      ja: 手札干渉
      match:
        - 'Look at your opponent.s hand'
      children:
        - id: disrupt.hand.discard
          ja: 手札を捨てさせる
          match:
            - '[Dd]iscard a random (card|Item card|Pokémon Tool card) from your opponent.s hand'
            - 'Choose a Supporter card you find there and discard it'
            - 'Your opponent discards cards from their hand'
        - id: disrupt.hand.shuffle
          ja: 手札を山札にもどさせる
          match:
            - 'reveals a random card from their hand and shuffles it'
            - 'random card from your opponent.s hand and shuffle it into their deck'
            - 'shuffle it into your opponent.s deck'
            - 'Your opponent shuffles their hand into their deck'
            - 'opponent shuffle their hand into their deck'
            - 'a card is chosen at random from your opponent.s hand\. Your opponent reveals that card and shuffles'
            - 'both player.s hands is chosen at random'
            - 'Each player shuffles the cards in their hand'
        - id: disrupt.hand.peek
          ja: 手札を見る
          match:
            - 'opponent reveal(s)? their hand'
            - 'look at a random (card|Supporter card) from your opponent.s hand'
            - 'Your opponent reveals all of the Supporter cards in their deck'
    - id: disrupt.switch_opp
      ja: 相手を入れ替えさせる
      match:
        - '[Ss]witch (in|out) [^.]*opponent.s'
        - 'switch in 1 of your opponent.s'
    - id: disrupt.lock
      ja: 封じ
      children:
        - id: disrupt.lock.supporter
          ja: サポート封じ
          match: ['can.t use any Supporter cards']
        - id: disrupt.lock.item
          ja: グッズ封じ
          match: ['can.t (play|use) any (Item|Trainer) cards']
        - id: disrupt.lock.ability
          ja: 特性封じ
          match: ['loses all Abilities', 'have no Abilities']
        - id: disrupt.lock.evolve
          ja: 進化封じ
          match: ['can.t play any Pokémon from (their|your) hand to evolve']
        - id: disrupt.lock.energy
          ja: エネ付け封じ
          match: ['can.t take any Energy from their Energy Zone', 'that Pokémon will be Asleep']
        - id: disrupt.lock.heal
          ja: 回復封じ
          match: ['can.t be healed']
        - id: disrupt.lock.stadium
          ja: スタジアム封じ
          match: ['can.t play any Stadium']
    - id: disrupt.cost_up
      ja: 相手のワザのエネを増やす
      match:
        - 'cost \d+ \[C\] more'
    - id: disrupt.deck
      ja: 山札を削る
      match:
        - '[Dd]iscard the top (card|\d+ cards) of (your opponent.s|each player.s) deck'
        - 'discard the top card of your opponent.s deck'
    - id: disrupt.tool
      ja: どうぐ・スタジアムを壊す
      match:
        - '[Dd]iscard (all |a |up to \d+ )?Pokémon Tools? (card )?(cards )?(from|attached)'
        - 'shuffle all Pokémon Tools from'
        - 'Return all Pokémon Tools'
        - 'Discard a Stadium'
        - 'discard a Stadium card in play'
        - 'Discard a Pokémon Tool card from a Pokémon'

- id: field
  ja: 場の操作
  children:
    - id: field.switch
      ja: 自分の入れ替え・にげる補助
      supplies: [supply.retreat.help]
      match:
        - '[Ss]witch this Pokémon with'
        - 'switch it with your Active Pokémon'
        - '[Ss]witch your Active [^.]*with'
        - 'You may switch this Pokémon'
    - id: field.bounce
      ja: 手札・山札にもどす
      match:
        - '[Pp]ut (your|1 of your) [^.]*(in the Active Spot|in play|that has damage on it)[^.]* into your hand'
        - 'put your opponent.s Active Pokémon into their hand'
        - '[Ss]huffle (this Pokémon|1 of your Future Pokémon)'
        - 'shuffles their Active Pokémon back into their deck'
    - id: field.evolve
      ja: 進化補助
      supplies: [supply.evolve.help]
      match:
        - 'onto (this|that|the Basic) Pokémon to evolve it'
        - 'skipping the Stage 1'
        - 'can evolve during your first turn'
        - 'can evolve into any Pokémon'
    - id: field.devolve
      ja: 退化させる
      match: ['devolve']
    - id: field.bench_fill
      ja: ベンチに出す
      supplies: [supply.bench.fill]
      match:
        - 'from your (deck|discard pile) onto your Bench'
        - 'onto your opponent.s Bench'
        - 'onto their Bench'
    - id: field.copy
      ja: ワザ・効果をコピー
      match:
        - 'use it as this attack'
        - 'use the chosen attack as this attack'
        - 'Use the effect of that card'
        - 'can use any attack from its previous Evolutions'
    - id: field.stadium
      ja: スタジアム関連
      match:
        - 'Stadium'
    - id: field.tool
      ja: どうぐ関連
      match:
        - 'Pokémon Tool'

- id: point
  ja: ポイント・きぜつ
  children:
    - id: point.on_ko
      ja: 倒したときに効果
      match:
        - 'opponent.s (Active )?Pokémon is Knocked Out by damage from (this|an attack used by)'
        - 'you get 1 more point'
        - 'Whenever your opponent.s Pokémon is Knocked Out'
    - id: point.on_knocked
      ja: 倒されたときに効果
      match:
        - '(this Pokémon|this card is attached to) is Knocked Out by damage'
        - 'and is Knocked Out by damage'
        - 'When this Pokémon is Knocked Out'
        - 'Pokémon were Knocked Out by damage from an attack during your opponent.s last turn'

- id: passive
  ja: 常時効果
  children:
    - id: passive.ability
      ja: 常時はたらく特性
      on: [ability]
      # 「自分の番に1回」でない特性。scripts/tag.ts で判定
    - id: passive.tool
      ja: どうぐで強化
      on: [tool]
    - id: passive.type_boost
      ja: タイプ・グループ全体を強化
      match:
        - 'attacks used by (your|each) \[[A-Z]\] Pokémon'
        - 'Attacks used by your \[[A-Z]\] Pokémon'
        - 'Each of your \[[A-Z]\] Pokémon gets'
        - 'Each \[[A-Z]\] Energy attached to your \[[A-Z]\] Pokémon provides'
        - 'all of your \[[A-Z]\] Pokémon take'
        - 'Heal \d+ damage from each of your \[[A-Z]\] Pokémon'
        - 'Attacks used by your (Future|Ancient)'
        - 'all of your Ultra Beasts'

- id: cond
  ja: 条件で変わる
  children:
    - id: cond.trash
      ja: トラッシュで変わる
      children:
        - id: cond.trash.count
          ja: トラッシュの枚数で変わる
          requires: [supply.trash.fill]
          match:
            - 'for each [^.]*in your discard pile'
        - id: cond.trash.card
          ja: トラッシュに特定のカード
          match:
            - 'If [^.]* is in your discard pile'
    - id: cond.bench
      ja: ベンチで変わる
      children:
        - id: cond.bench.own
          ja: 自分のベンチの数で変わる
          requires: [supply.bench.fill]
          match:
            - 'for each (of your Benched|Benched Pokémon|Evolution Pokémon on your Bench)'
            - 'for each Pokémon you have in play'
            - 'fewer Pokémon in play than your opponent'
            - 'for each of your Benched'
        - id: cond.bench.opp
          ja: 相手のベンチの数で変わる
          match:
            - 'for each of your opponent.s Benched'
            - 'for each Benched Pokémon \(both'
        - id: cond.bench.specific
          ja: 特定のポケモンがいると変わる
          match:
            - 'If [A-Z][^.]* is on your Bench'
            - 'If you have [^.]* in play'
            - 'only if you have [^.]* (on your Bench|in play)'
            - 'If you don.t have'
            - 'If you have any Stage 2 Pokémon on your Bench'
            - 'for each [A-Z][a-z]+ (and [A-Z][a-z]+ )?you have in play'
            - 'for each of your Benched [A-Z][a-z]+'
            - 'that have the [A-Z][\w ]+ attack'
    - id: cond.energy
      ja: エネルギーで変わる
      requires: [supply.energy.many]
      match:
        - 'for each (\[[A-Z]\] )?Energy attached to (this|all of your)'
        - 'more Energy attached than'
        - 'amount of Energy attached'
        - 'for each type of Energy'
        - 'different types of Energy attached'
        - 'extra \[[A-Z]\] Energy attached'
        - 'has any \[[A-Z]\] Energy attached, this attack'
        - 'Energy in play, this attack'
        - 'same type of Energy attached'
        - 'for each Energy attached to (your opponent|all of your opponent)'
        - 'for each Energy in your opponent.s Active Pokémon.s Retreat Cost'
        - 'Flip a coin for each (\[[A-Z]\] )?Energy attached'
    - id: cond.damage
      ja: ダメージで変わる
      children:
        - id: cond.damage.self
          ja: 自分のダメージで変わる
          requires: [supply.damage.self]
          match:
            - 'this Pokémon has (damage on it|no damage|full HP)'
            - 'this Pokémon.s remaining HP is'
            - 'damage this Pokémon has on it'
            - 'equal to this Pokémon.s remaining HP'
            - 'Benched Pokémon have damage on them'
        - id: cond.damage.opp
          ja: 相手のダメージ・HPで変わる
          match:
            - 'opponent.s Active Pokémon has damage on it'
            - 'Pokémon that have damage on them'
            - 'Benched Pokémon that has damage on it'
            - 'remaining HP than this Pokémon'
    - id: cond.deck
      ja: 山札の中身で変わる
      match:
        - 'for each [^.]* in your opponent.s deck'
        - 'Discard the top card of your deck(, and if that card is|\. If that card is)'
        - 'Reveal the top \d+ cards of your deck\. This attack does'
    - id: cond.hand
      ja: 手札の枚数で変わる
      match:
        - 'cards? in (your|their) hand(,| as)'
        - 'for each card in your hand'
        - 'for each card in your opponent.s hand'
    - id: cond.point
      ja: ポイントで変わる
      match:
        - 'point(s)? you have gotten'
        - 'point(s)? your opponent (has gotten|got)'
        - 'haven.t gotten any points'
        - 'has gotten (exactly|at least) \d+ point'
        - 'hasn.t gotten any points'
        - 'remaining points? needed to win'
        - 'remaining point that your opponent needs'
    - id: cond.turn
      ja: 前の番・この番の行動で変わる
      match:
        - 'during your (opponent.s )?last turn'
        - 'evolved (from [^.]* )?during this turn'
        - 'moved from (your|the) Bench to the Active Spot this turn'
        - 'move from the Bench to the Active Spot this turn'
        - 'first time this Pokémon has used an attack'
        - 'played a Supporter card from your hand during this turn'
        - 'used Sweets Relay'
        - 'Knocked Out during this game'
    - id: cond.status
      ja: 相手が状態異常だと変わる
      requires: [supply.status]
      match:
        - 'If your opponent.s Active Pokémon is (Asleep|Burned|Confused|Poisoned|affected by a Special Condition)'
        - 'for each Special Condition affecting'
    - id: cond.target
      ja: 相手の種類で変わる
      match:
        - 'If your opponent.s Active Pokémon is (a|an) '
        - 'If your opponent.s Active Pokémon (has an Ability|has a Pokémon Tool|has .Team Rocket|is Zangoose)'
        - 'If your opponent has any \[[A-Z]\] Pokémon in play'
        - 'If the Defending Pokémon is a Basic'
        - 'opponent.s Pokémon in play that has an Ability'
        - 'from attacks from (\[[A-Z]\] (or \[[A-Z]\] )?Pokémon|Basic Pokémon|your opponent.s Pokémon ex)'
    - id: cond.tool
      ja: どうぐが付いていると変わる
      match:
        - 'If this Pokémon has a Pokémon Tool attached'
        - 'for each Pokémon Tool attached'
    - id: cond.stadium
      ja: スタジアムがあると変わる
      match:
        - 'If a Stadium is in play'

- id: coin
  ja: コイン
  children:
    - id: coin.single
      ja: コイン1回
      match:
        - 'Flip a coin\.'
        - 'flip a coin\.'
        - 'may flip a coin\.'
    - id: coin.multi
      ja: コイン複数回
      match:
        - '[Ff]lip \d+ coins'
        - 'Flip a coin for each'
    - id: coin.until
      ja: ウラが出るまでコイン
      match:
        - 'until you get tails'
    - id: coin.risk
      ja: コイン失敗でデメリット
      match:
        - 'If tails, (this attack does nothing|this Pokémon (also does|is now)|discard|during your next turn)'
        - 'If (both|all) of them are tails, this attack does nothing'
    - id: coin.control
      ja: コインを操作
      match:
        - 'ignore all results of those coin flips'
        - 'will definitely be heads'

- id: drawback
  ja: デメリット
  children:
    - id: drawback.cant_attack
      ja: 次の番ワザが使えない
      match:
        - 'During your next turn, this Pokémon can.t (attack|use)'
        - 'during your next turn, this Pokémon can.t attack'
    - id: drawback.self_status
      ja: 自分が状態異常になる
      match:
        - '^This Pokémon is now'
        - 'your Active Pokémon is now also'
        - 'If tails, this Pokémon is now'
        - 'Both Active Pokémon are now'
        - 'it is now Asleep'
    - id: drawback.discard_hand
      ja: 手札を捨てる
      supplies: [supply.trash.fill]
      match:
        - '[Dd]iscard (a card|\d+ cards|up to \d+ Pokémon Tool cards) from your hand'
        - 'discard a card from your hand'
    - id: drawback.discard_deck
      ja: 自分の山札を捨てる
      supplies: [supply.trash.fill]
      match:
        - '[Dd]iscard the top (card|\d+ cards) of your deck'
        - 'top \d+ cards of each player.s deck'
    - id: drawback.discard_bench
      ja: 自分のベンチをトラッシュ
      supplies: [supply.trash.fill]
      match:
        - 'discard (1|any number) of your Benched'
        - 'If you do, discard this Pokémon'
    - id: drawback.ends_turn
      ja: 自分の番が終わる
      match:
        - '[Yy]our turn ends'
    - id: drawback.condition
      ja: 使える条件がある
      match:
        - '[Yy]ou can use this (card|attack) only if'
        - 'this attack does nothing'
        - 'this Pokémon can.t attack\.$'
      exclude:
        - '^Flip'
        - 'tails'
        - '^During your next turn'
