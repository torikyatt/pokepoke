<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6ecf3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="POKÉPOKE INDECKS — ふだんの言葉で引ける、ポケポケ（Pokémon TCG Pocket）のカード図鑑。相性の良いカードや大会での使われ方も分かり、そのままデッキも組めます。" />
    <title>POKÉPOKE INDECKS｜ポケポケのカード図鑑</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <!-- ホーム画面に追加したときのアイコンと名前 -->
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="INDECKS" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 古いURL（GitHub Pages）から引っ越してきたとき、転送ページが #move=…&to=… で渡すデッキ・お気に入り・設定を受け取る。
      // すでにこのサイトで保存しているものは消さず、デッキは足し、お気に入りは合わせる。アプリより先に動かす
      (function () {
        try {
          var m = /^#move=([^&]*)&to=(.*)$/.exec(location.hash);
          if (!m) return;
          var d = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")))));
          for (var k in d) {
            if (!/^pokepoke\./.test(k)) continue;
            var cur = localStorage.getItem(k);
            if (cur == null) { localStorage.setItem(k, d[k]); continue; }
            var a = JSON.parse(cur), b = JSON.parse(d[k]);
            if (k === "pokepoke.decks") {
              var ids = {};
              a.state.decks.forEach(function (x) { ids[x.id] = 1; });
              b.state.decks.forEach(function (x) { if (!ids[x.id]) a.state.decks.push(x); });
              if (!a.state.currentId) a.state.currentId = b.state.currentId;
            } else if (k === "pokepoke.favorites") {
              b.state.ids.forEach(function (x) { if (a.state.ids.indexOf(x) < 0) a.state.ids.push(x); });
            } else continue; // 設定などは、こちらで選んだものを優先する
            localStorage.setItem(k, JSON.stringify(a));
          }
          history.replaceState(null, "", location.pathname + location.search + (decodeURIComponent(m[2]) || "#/"));
        } catch (e) {}
      })();
    </script>
    <noscript>このページはJavaScriptが必要です。JavaScriptが動くブラウザで開いてください。</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
