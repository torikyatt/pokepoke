<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e6ecf3" />
    <script>
      // Windows では丸ゴシックの Web フォントがギザギザに見えるので、Windows 用のフォントにする（index.css の html.win）
      if (/Windows/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.userAgent)) document.documentElement.classList.add("win");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="POKÉPOKE INDECKS — ふだんの言葉で引ける、ポケポケ（Pokémon TCG Pocket）のカード図鑑。相性の良いカードや大会での使われ方も分かり、そのままデッキも組めます。" />
    <title>POKÉPOKE INDECKS｜ポケポケのカード図鑑</title>
    <link rel="canonical" href="https://pokepokeindex.com/" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <!-- ホーム画面に追加したときのアイコンと名前 -->
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="INDECKS" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 古いURL（GitHub Pages）から引っ越してきたとき、転送ページが #move=…&to=… で渡すデッキ・お気に入り・表示言語を受け取る。
      // すでにこのサイトで保存しているものは消さず、デッキは足し、お気に入りは合わせる。アプリより先に動かす。
      // だれでも #move=… 付きのリンクを作れるので、受け取るのは決まった形のものだけにし、
      // 古いサイトの転送ページから来たのでなければ、取り込む前に確かめる
      // 検索エンジン用のカードページ（/card/<ID>・/en/card/<ID>、scripts/seo-pages.ts）から開いたら、
      // アプリのカード詳細（/#/card/<ID>）にする。英語のページで、まだ言語を選んでいなければ英語にする
      // デッキの共有リンク（/d/<共有コード>・/en/d/<共有コード>、server/deck-page.ts）も同じように、共有デッキの画面（/#/share/<共有コード>）にする
      (function () {
        var d = /^\/(en\/)?d\/([^/?#]+)\/?$/.exec(location.pathname);
        if (!d) return;
        try {
          if (d[1] && localStorage.getItem("pokepoke.settings") == null) localStorage.setItem("pokepoke.settings", JSON.stringify({ state: { lang: "en", imageLang: "en" }, version: 1 }));
        } catch (e) {}
        history.replaceState(null, "", "/" + (location.hash.length > 2 ? location.hash : "#/share/" + d[2]));
      })();
      (function () {
        var c = /^\/(en\/)?card\/([a-z0-9-]+)\/?$/.exec(location.pathname);
        if (!c) return;
        try {
          if (c[1] && localStorage.getItem("pokepoke.settings") == null) localStorage.setItem("pokepoke.settings", JSON.stringify({ state: { lang: "en", imageLang: "en" }, version: 1 }));
        } catch (e) {}
        history.replaceState(null, "", "/" + (location.hash.length > 2 ? location.hash : "#/card/" + c[2]));
      })();
      (function () {
        var m = /^#move=([^&]*)&to=(.*)$/.exec(location.hash);
        if (!m) return;
        var to = "#/";
        try {
          var t = decodeURIComponent(m[2]);
          if (/^#\/[^\s]*$/.test(t)) to = t;
          var d = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")))));
          var ID = /^[a-z0-9-]{1,24}$/, TYPES = /^(grass|fire|water|lightning|psychic|fighting|darkness|metal|dragon|colorless)$/;
          var str = function (x, n) { return typeof x === "string" && x.length <= n; };
          var ids = function (a, n) { return Array.isArray(a) ? a.filter(function (x) { return str(x, 24) && ID.test(x); }).slice(0, n) : []; };
          var state = function (k) { try { var v = JSON.parse(d[k]); return v && typeof v.state === "object" && v.state ? v.state : null; } catch (e) { return null; } };
          var decks = ((state("pokepoke.decks") || {}).decks || []).filter(function (x) { return x && str(x.id, 40) && str(x.name, 100); }).slice(0, 200).map(function (x) {
            return { id: x.id, name: x.name, cards: ids(x.cards, 60), energy: Array.isArray(x.energy) ? x.energy.filter(function (e) { return TYPES.test(e); }).slice(0, 3) : [], updatedAt: Number(x.updatedAt) || Date.now() };
          });
          var favs = ids((state("pokepoke.favorites") || {}).ids, 5000);
          var lang = (state("pokepoke.settings") || {}).lang;
          if (!decks.length && !favs.length) throw 0;
          var fromOld = /^https:\/\/torikyatt\.github\.io\//.test(document.referrer);
          if (!fromOld && !confirm("ほかのページから、デッキ " + decks.length + " 個・お気に入り " + favs.length + " 件を、このブラウザに取り込もうとしています。取り込みますか？\n（心当たりがなければ「キャンセル」）")) throw 0;
          var read = function (k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
          var cur = read("pokepoke.decks");
          if (!cur || !cur.state || !Array.isArray(cur.state.decks)) cur = { state: { decks: [] }, version: 1 };
          var have = {};
          cur.state.decks.forEach(function (x) { have[x.id] = 1; });
          decks.forEach(function (x) { if (!have[x.id]) cur.state.decks.push(x); });
          if (!cur.state.currentId && cur.state.decks[0]) cur.state.currentId = cur.state.decks[0].id;
          localStorage.setItem("pokepoke.decks", JSON.stringify(cur));
          var fav = read("pokepoke.favorites");
          if (!fav || !fav.state || !Array.isArray(fav.state.ids)) fav = { state: { ids: [] }, version: 1 };
          favs.forEach(function (x) { if (fav.state.ids.indexOf(x) < 0) fav.state.ids.push(x); });
          localStorage.setItem("pokepoke.favorites", JSON.stringify(fav));
          // 表示言語は、このサイトでまだ何も選んでいないときだけ
          if ((lang === "ja" || lang === "en") && localStorage.getItem("pokepoke.settings") == null) localStorage.setItem("pokepoke.settings", JSON.stringify({ state: { lang: lang }, version: 1 }));
        } catch (e) {}
        history.replaceState(null, "", location.pathname + location.search + to);
      })();
    </script>
    <noscript>このページはJavaScriptが必要です。JavaScriptが動くブラウザで開いてください。</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
